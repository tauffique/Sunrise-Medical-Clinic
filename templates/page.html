{% extends "base.html" %}
{% block title %}{{ T(title_key) }} · {{ clinic_name }}{% endblock %}
{% block content %}
<article class="container prose">
  <h1>{{ T(title_key) }}</h1>
  {% for paragraph in T(body_key).split('\n\n') %}
  <p>{{ paragraph }}</p>
  {% endfor %}
  <p><a href="{{ url_for('web.index', lang=lang) }}">{{ T('back_home') }}</a></p>
</article>
{% endblock %}
